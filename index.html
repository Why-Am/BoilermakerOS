<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style.css" />
    <title>BoilermakerOS</title>
</head>

<body>
    <div id="desktop">
        <div class="window" id="welcome">
            <div class="window-header" id="welcome-header">
                <p></p>
                <div id="welcome-close" class="window-button-close"></div>
            </div>
            <div class="text-content">
                <h1>Welcome to BoilermakerOS</h1>
                <p>BoilermakerOS is an unofficial Purdue University themed webOS.</p>
                <p>Click on the desktop icons to launch apps.</p>
            </div>
        </div>

        <div class="window" id="links">
            <div class="window-header" id="links-header">
                <p></p>
                <div id="links-close" class="window-button-close"></div>
            </div>
            <div class="window-content-with-sidebar">
                <div class="sidebar">
                    <!-- To be populated -->
                </div>
                <div class="text-content">
                    <!-- To be populated -->
                </div>
            </div>
        </div>

        <div class="window" id="wl-clock">
            <div class="window-header" id="wl-clock-header">
                <p></p>
                <div id="wl-clock-close" class="window-button-close"></div>
            </div>
            <div class="text-content">
                <p id="wl-clock-heading">Time in West Lafayette:</p>
                <p id="wl-clock-time"></p>
                <p id="wl-clock-date"></p>
            </div>
        </div>

        <div class="window" id="wl-weather">
            <div class="window-header" id="wl-weather-header">
                <p></p>
                <div id="wl-weather-close" class="window-button-close"></div>
            </div>
            <div class="text-content">
                <p id="wl-weather-heading">Weather in West Lafayette:</p>
                <p id="wl-weather-temperature">?</p>
                <p id="wl-weather-conditions">?</p>
                <p>Source: Open-Meteo</p>
                <p>
                    Last updated:
                    <span id="wl-weather-last-updated">[time]</span>
                    (<a id="wl-weather-refresh">refresh</a>)
                </p>
            </div>
        </div>

        <div id="desktop-apps">
            <!-- To be populated -->
        </div>
    </div>

    <div id="bottom-bar">
        <p>BoilermakerOS</p>
        <p id="splash-text">"Placeholder splash text"</p>
        <p id="time-display">Time</p>
    </div>

    <script type="module" src="main.js"></script>
</body>

</html>
