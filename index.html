<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style.css" />
    <title>BoilermakerOS</title>
</head>

<body>
    <div id="desktop">
        <div class="window" id="welcome">
            <div class="window-header" id="welcome-header">
                <p>Welcome</p>
                <div id="welcome-close" class="window-button-close"></div>
            </div>
            <div class="window-content">
                <h1>Welcome to BoilermakerOS</h1>
                <p>BoilermakerOS is an unofficial Purdue University themed webOS</p>
            </div>
        </div>

        <div class="window" id="links">
            <div class="window-header" id="welcome-header">
                <p>Links</p>
                <div id="links-close" class="window-button-close"></div>
            </div>
            <div class="window-content">
                <h1>Some Links</h1>
                <a href="https://www.boilerexams.com" target="_blank">Boilerexams</a>
            </div>
        </div>

        <div id="desktop-apps">
            <div class="desktop-app" id="welcome-open">
                <img src="image/app_icon/Welcome.png" class="app-icon">
                <p class="app-title">Welcome</p>
            </div>

            <div class="desktop-app" id="links-open">
                <img src="image/app_icon/Links.png" class="app-icon">
                <p class="app-title">Links</p>
            </div>
        </div>
    </div>

    <div id="bottom-bar">
        <p>BoilermakerOS</p>
        <p id="time-display">Time</p>
    </div>

    <script type="module" src="main.js"></script>
</body>

</html>
